server:
  port: 8080
  servlet:
    context-path: /api
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  liquibase:
    enabled: true
    change-log: classpath:db/master.xml
  jpa:
    database: POSTGRESQL
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: none
  datasource:
    url: jdbc:postgresql://${PG_URL:localhost:5432}/test
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:postgres}

logging:
  level:
    root: info