server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, liveness, readiness, mappings

spring:
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: my-bar-app #Имя приложения в KeyCloak
            client-secret: j6gPmgLz20pZKtgIaLKmG13eltwWXXIr
            scope: openid

        provider:
          keycloak:
            issuer-uri: http://localhost:8081/realms/my-bar
            user-name-attribute: preferred_username

      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/my-bar

  docker:
    compose:
      enabled: true
      file: docker-compose.yaml
  liquibase:
    enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    database: POSTGRESQL
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: create
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${POSTGRES_DB:postgres}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
logging:
  level:
    root: debug