server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, liveness, readiness, mappings, env

spring:
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: my-bar-app #Имя приложения в KeyCloak
            scope: openid
            provider: keycloak
            authorization-grant-type: authorization_code
            redirect-uri: http://mybar.dvmalkin.ru/api/login/oauth2/code/my-bar-app

        provider:
          keycloak:
            issuer-uri: http://bouncer.dvmalkin.ru/realms/my-bar
            user-name-attribute: preferred_username

  liquibase:
    enabled: true
    change-log: classpath:db/master.xml

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    database: POSTGRESQL
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: none
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${POSTGRES_DB:postgres}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER}
  secret-key: ${MINIO_ROOT_PASSWORD}
  bucket: ${MINIO_BUCKET:my-bar}





logging:
  level:
    root: ${LOG_LEVEL:DEBUG}