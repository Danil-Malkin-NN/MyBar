server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, liveness, readiness, mappings



spring:
  security:

    enabled: false

  liquibase:
    enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  docker:
    compose:
      enabled: true
      file: compose.yaml

  jpa:
    database: POSTGRESQL
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: create
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${POSTGRES_DB:test}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
logging:
  level:
    root: info