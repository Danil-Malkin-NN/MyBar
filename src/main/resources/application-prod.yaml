server:
  port: 8080
  servlet:
    context-path: /api
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, liveness, readiness, mappings

# JWT Configuration
jwt:
  auth:
    converter:
      resource-id: my-super-client
      principal-attribute: principal_username

spring:
  liquibase:
    enabled: true
    change-log: classpath:db/master.xml

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: my-bar-app #Имя приложения в KeyCloak
            #            client-secret: ghjitBpmcgVOMj1tDd4DjwkfSE0wCxqd
            scope: openid

        provider:
          keycloak:
            issuer-uri: ${KEY_CLOAK_URL:http://localhost:8081/realms/my-bar}
            user-name-attribute: preferred_username

      resourceserver:
        jwt:
          issuer-uri: ${KEY_CLOAK_URL:http://localhost:8081/realms/my-bar}
          jwk-set-uri: ${KEY_CLOAK_URL:http://localhost:8081/realms/my-bar}/protocol/openid-connect/token
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    database: POSTGRESQL
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: none
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:55432}/${POSTGRES_DB:postgres}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

logging:
  level:
    root: info