
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gin Tonic Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <div class="card-image">
      <img src="Джин Тоник.png" alt="Gin Tonic" />
      <div class="card-title-overlay">GIN TONIC</div>
    </div>
    <div class="card-content">
      <h2>Gin Tonic</h2>
      <div class="tags">
        <span class="tag">Терпкий</span>
        <span class="tag">Кислый</span>
      </div>
      <div class="rating">
        <span class="number">20</span>
        <span class="star">☆</span>
      </div>
    </div>
  </div>
</body>
</html>
