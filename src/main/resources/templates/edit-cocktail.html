<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактировать коктейль</title>
    <!-- Подключение Tailwind CSS -->

    <!-- Подключение вашего собственного CSS -->

    <style>
        /* Убираем ограничение по ширине контейнера контента */
        .content {
            max-width: 100%;
            padding: 20px;
        }

        /* Стили для иконок редактирования */
        .edit-icon {
            margin-right: 10px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .edit-icon:hover {
            color: #007bff;
        }

        /* Стили для формы */
        .form-group {
            margin-bottom: 15px;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .section-title {
            margin-bottom: 20px;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .list-group {
            list-style: none;
            padding: 0;
        }

        .list-group-item {
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .section {
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
<div th:replace="fragments/topbar.html"></div>

<div class="content">
    <h1 class="mb-4 section-title">Редактировать коктейль</h1>
    <form th:action="@{/page/AdminPanel/cocktail/save}" th:object="${cocktail}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="form-group">
            <label for="name">Имя:</label>
            <input type="text" id="name" class="form-control" th:field="*{name}"/>
        </div>

        <div class="form-group">
            <label for="description">Описание:</label>
            <textarea id="description" class="form-control" th:field="*{description}"></textarea>
        </div>

        <div class="form-group">
            <label for="volume">Объем:</label>
            <input type="text" id="volume" class="form-control" th:field="*{volume}"/>
        </div>

        <div class="form-group">
            <label for="strength">Крепость:</label>
            <input type="text" id="strength" class="form-control" th:field="*{strength}"/>
        </div>

        <div class="form-group">
            <label>Ингредиенты:</label>
            <ul class="list-group">
                <li th:each="ing, ingStat : *{ingredients}" class="list-group-item">
                    <input type="hidden" th:field="*{ingredients[__${ingStat.index}__].id}"/>
                    <div class="form-group">
                        <label th:for="'ingredientName' + ${ingStat.index}">Имя ингредиента:</label>
                        <input type="text" th:id="'ingredientName' + ${ingStat.index}" class="form-control"
                               th:field="*{ingredients[__${ingStat.index}__].name}"/>
                    </div>
                    <div class="form-group">
                        <label th:for="'ingredientCount' + ${ingStat.index}">Количество:</label>
                        <input type="text" th:id="'ingredientCount' + ${ingStat.index}" class="form-control"
                               th:field="*{ingredients[__${ingStat.index}__].count}"/>
                    </div>
                    <div class="form-group">
                        <label th:for="'ingredientUnitType' + ${ingStat.index}">Тип единицы:</label>
                        <input type="text" th:id="'ingredientUnitType' + ${ingStat.index}" class="form-control"
                               th:field="*{ingredients[__${ingStat.index}__].unitType}"/>
                    </div>
                </li>
            </ul>
        </div>




        <div class="section">
            <h2>Шаги приготовления</h2>
            <div th:each="step, stepStat : *{steps}" class="step mb-4">
                <h3>Шаг <span th:text="${stepStat.index + 1}"></span></h3>
                <input type="hidden" th:field="*{steps[__${stepStat.index}__].id}"/>

                <div class="form-group">
                    <label th:for="'goal' + ${stepStat.index}">Задача:</label>
                    <input type="text" th:id="'goal' + ${stepStat.index}" class="form-control"
                           th:field="*{steps[__${stepStat.index}__].goal}"/>
                </div>

                <div class="form-group">
                    <label th:for="'stepDescription' + ${stepStat.index}">Описание:</label>
                    <textarea th:id="'stepDescription' + ${stepStat.index}" class="form-control"
                              th:field="*{steps[__${stepStat.index}__].description}"></textarea>
                </div>

                <div class="form-group">
                    <label>Ингредиенты:</label>
                    <ul class="list-group">
                        <li th:each="ing, ingStat : *{steps[__${stepStat.index}__].usesIngredients}" class="list-group-item">
                            <input type="hidden" th:field="*{steps[__${stepStat.index}__].usesIngredients[__${ingStat.index}__].id}"/>
                            <div class="form-group">
                                <label th:for="'stepIngredientName' + ${stepStat.index} + ${ingStat.index}">Имя ингредиента:</label>
                                <input type="text" th:id="'stepIngredientName' + ${stepStat.index} + ${ingStat.index}" class="form-control"
                                       th:field="*{steps[__${stepStat.index}__].usesIngredients[__${ingStat.index}__].ingredient.name}"/>
                            </div>
                            <div class="form-group">
                                <label th:for="'stepCount' + ${stepStat.index} + ${ingStat.index}">Количество:</label>
                                <input type="text" th:id="'stepCount' + ${stepStat.index} + ${ingStat.index}" class="form-control"
                                       th:field="*{steps[__${stepStat.index}__].usesIngredients[__${ingStat.index}__].count}"/>
                            </div>
                            <div class="form-group">
                                <label th:for="'stepUnitType' + ${stepStat.index} + ${ingStat.index}">Тип единицы:</label>
                                <input type="text" th:id="'stepUnitType' + ${stepStat.index} + ${ingStat.index}" class="form-control"
                                       th:field="*{steps[__${stepStat.index}__].usesIngredients[__${ingStat.index}__].unitType}"/>
                            </div>

                        </li>
                    </ul>
                </div>
            </div>
        </div>


        <button type="submit" class="btn btn-primary">Сохранить</button>
    </form>
</div>

<!-- Подключение Bootstrap JS и зависимостей -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
