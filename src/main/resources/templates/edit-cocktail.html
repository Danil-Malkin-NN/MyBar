<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редактировать коктейль</title>
    <!-- Подключение Bootstrap и Tailwind -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        /* Стили для топ-бара */
        .topbar {
            background-color: #343a40;
            padding: 10px 0;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 1000;
            position: relative;
        }
        .topbar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
        }
        .topbar a {
            color: #ffffff;
            margin: 0 15px;
            text-decoration: none;
        }
        .topbar a:hover {
            color: #0730ff;
        }

        /* Стили для формы */
        .content {
            margin-top: 60px;
            padding: 20px;
        }
        .form-group { margin-bottom: 15px; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .section-title { margin-bottom: 20px; }
        .btn-primary { background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-primary:hover { background-color: #0056b3; }
        .list-group { list-style: none; padding: 0; }
        .list-group-item { padding: 15px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .section { margin-bottom: 30px; }
    </style>
</head>
<body>
<!-- Топ-бар -->
<div class="topbar">
    <div class="container-fluid d-flex justify-content-start align-items-center">
        <a th:href="@{/page}">Главная</a>
        <a th:href="@{/page/ingredients}">Ингредиенты</a>
        <a th:href="@{/page/tools}">Инструменты</a>
        <a th:href="@{/page/my/bar}">Мой Бар</a>
    </div>
</div>

<!-- Основное содержимое -->
<div class="content">
    <div class="container mx-auto p-4">
        <h1 class="text-2xl font-bold mb-4">Редактировать коктейль</h1>
        <form th:action="@{/page/AdminPanel/cocktail/save}" th:object="${cocktail}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <!-- Основные поля коктейля -->
            <div class="form-group">
                <label for="name">Имя:</label>
                <input type="text" id="name" class="form-control" th:field="*{name}"/>
            </div>

            <div class="form-group">
                <label for="volume">Объем:</label>
                <input type="text" id="volume" class="form-control" th:field="*{volume}"/>
            </div>

            <div class="form-group">
                <label for="strength">Крепость:</label>
                <input type="text" id="strength" class="form-control" th:field="*{strength}"/>
            </div>

            <div class="mb-4">
                <label for="description" class="block text-gray-700">Описание:</label>
                <textarea id="description" class="form-control" th:field="*{description}"></textarea>
            </div>

            <!-- Ингредиенты -->
            <div class="form-group">
                <label>Ингредиенты:</label>
                <ul class="list-group">
                    <li th:each="ing, ingStat : *{ingredients}" class="list-group-item">
                        <input type="hidden" th:field="*{ingredients[__${ingStat.index}__].id}"/>
                        <input type="hidden" th:field="*{ingredients[__${ingStat.index}__].ingredient.id}"/>
                        <input type="hidden" th:name="_ingredients[__${ingStat.index}__]._remove" value="false" class="remove-flag"/>

                        <div class="flex justify-between items-start">
                            <div class="flex-grow">
                                <div class="form-group">
                                    <label>Имя ингредиента:</label>
                                    <input type="text" class="form-control" th:value="${ing.ingredient.name}" readonly/>
                                </div>
                                <div class="form-group">
                                    <label th:for="'ingredientCount' + ${ingStat.index}">Количество:</label>
                                    <input type="text" th:id="'ingredientCount' + ${ingStat.index}" class="form-control"
                                           th:field="*{ingredients[__${ingStat.index}__].count}"/>
                                </div>
                                <div class="form-group">
                                    <label th:for="'ingredientUnitType' + ${ingStat.index}">Тип единицы:</label>
                                    <input type="text" th:id="'ingredientUnitType' + ${ingStat.index}" class="form-control"
                                           th:field="*{ingredients[__${ingStat.index}__].unitType}"/>
                                </div>
                            </div>
                            <div class="flex flex-col space-y-2">
                                <button type="button" class="bg-red-500 text-white px-4 py-2 rounded remove-ingredient">
                                    Удалить
                                </button>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>

            <!-- Инструменты -->
            <div class="section">
                <h2>Инструменты</h2>
                <div class="card-list">
                    <div class="card" th:each="tool, toolStat : *{instruments}">
                        <input type="hidden" th:field="*{instruments[__${toolStat.index}__].id}"/>
                        <input type="hidden" th:name="_instruments[__${toolStat.index}__]._remove" value="false" class="remove-flag"/>

                        <div class="form-group">
                            <label>Имя инструмента:</label>
                            <input type="text" class="form-control" th:field="*{instruments[__${toolStat.index}__].name}"/>
                        </div>
                        <div class="form-group">
                            <label>Описание:</label>
                            <textarea class="form-control" th:field="*{instruments[__${toolStat.index}__].description}"></textarea>
                        </div>
                        <div class="flex space-x-2">
                            <button type="button" class="bg-red-500 text-white px-4 py-2 rounded remove-tool">
                                Удалить
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Шаги приготовления -->
            <div class="section">
                <h2>Шаги приготовления</h2>
                <div th:each="step, stepStat : *{steps}" class="step mb-4">
                    <input type="hidden" th:field="*{steps[__${stepStat.index}__].id}"/>
                    <div class="form-group">
                        <label>Задача:</label>
                        <input type="text" class="form-control" th:field="*{steps[__${stepStat.index}__].goal}"/>
                    </div>
                    <div class="form-group">
                        <label>Описание:</label>
                        <textarea class="form-control" th:field="*{steps[__${stepStat.index}__].description}"></textarea>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Сохранить</button>
        </form>
    </div>
</div>

<script>
    // Удаление ингредиента через флаг
    document.querySelectorAll('.remove-ingredient').forEach(button => {
        button.addEventListener('click', function() {
            const item = this.closest('.list-group-item');
            const removeFlag = item.querySelector('.remove-flag');
            removeFlag.value = 'true';
            item.style.display = 'none';
        });
    });

    // Удаление инструмента через флаг
    document.querySelectorAll('.remove-tool').forEach(button => {
        button.addEventListener('click', function() {
            const item = this.closest('.card');
            const removeFlag = item.querySelector('.remove-flag');
            removeFlag.value = 'true';
            item.style.display = 'none';
        });
    });
</script>
</body>
</html>
