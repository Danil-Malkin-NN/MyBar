<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Application</title>
    <!-- Подключение Bootstrap -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .topbar {
            background-color: #343a40; /* Темный фон */
            padding: 10px 0; /* Верхний и нижний отступ */
            position: fixed; /* Фиксированное положение */
            width: 100%; /* Ширина на всю страницу */
            top: 0; /* Верхнее положение */
            left: 0; /* Левое положение */
            z-index: 1000; /* Уровень наложения */
            position: relative; /* Относительное положение для псевдоэлемента */
        }
        .topbar::before {
            content: '';
            position: absolute; /* Абсолютное положение */
            top: 0; /* Верхнее положение */
            left: 0; /* Левое положение */
            width: 100%; /* Ширина на всю панель */
            height: 5px; /* Высота полоски */
        }
        .topbar a {
            color: #ffffff; /* Белый цвет текста */
            margin: 0 15px; /* Отступы между ссылками */
            text-decoration: none; /* Убираем подчеркивание */
        }
        .topbar a:hover {
            color: #0730ff; /* Цвет текста при наведении */
        }
        .content {
            margin-top: 60px; /* Отступ для контента, чтобы не перекрывался topbar */
            padding: 20px; /* Внутренние отступы */
        }
    </style>
</head>
<body>
<div class="topbar">
    <div class="container-fluid d-flex justify-content-start align-items-center">
        <a th:href="@{/page}">Главная</a>
        <a th:href="@{/page/ingredients}">Ингредиенты</a>
        <a th:href="@{/page/tools}">Инструменты</a>
        <a th:href="@{/page/my/bar}">Мой Бар</a>
    </div>
</div>

<div class="content">
    <h1 class="mb-4 section-title">Редактировать коктейль</h1>
    <form th:action="@{/page/AdminPanel/cocktail/save}" th:object="${cocktail}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <!-- Поля коктейля, которые можно редактировать -->
        <div class="form-group">
            <label for="name">Имя:</label>
            <input type="text" id="name" class="form-control" th:field="*{name}"/>
        </div>

        <div class="form-group">
            <label for="volume">Объем:</label>
            <input type="text" id="volume" class="form-control" th:field="*{volume}"/>
        </div>

        <div class="form-group">
            <label for="strength">Крепость:</label>
            <input type="text" id="strength" class="form-control" th:field="*{strength}"/>
        </div>

        <!-- Описание коктейля (только для чтения) -->
        <div class="form-group">
            <label for="description">Описание:</label>
            <textarea id="description" class="form-control" th:field="*{description}" readonly></textarea>
        </div>

        <div class="mb-4">
            <label class="block text-gray-700">Инструменты:</label>
            <ul class="list-group">
                <li th:each="ing, ingStat : *{ingredients}" class="list-group-item">
                    <input type="hidden" th:field="*{ingredients[__${ingStat.index}__].id}"/>
                    <input type="hidden" th:field="*{ingredients[__${ingStat.index}__].ingredient.id}"/>

                    <!-- Название инструмента (только для чтения) -->
                    <div class="form-group">
                        <label>Имя инструмента:</label>
                        <input type="text" class="form-control"
                               th:value="${ing.ingredient.name}" readonly/>
                    </div>

                    <!-- Описание инструмента (только для чтения) -->
                    <div class="form-group">
                        <label>Описание инструмента:</label>
                        <input type="text" class="form-control"
                               th:value="${ing.ingredient.description}" readonly/>
                    </div>


                </li>
            </ul>
        </div>


        <!-- Ингредиенты (редактируется только количество и тип единицы) -->
        <div class="form-group">
            <label>Ингредиенты:</label>
            <ul class="list-group">
                <li th:each="ing, ingStat : *{ingredients}" class="list-group-item">
                    <input type="hidden" th:field="*{ingredients[__${ingStat.index}__].id}"/>
                    <input type="hidden" th:field="*{ingredients[__${ingStat.index}__].ingredient.id}"/>

                    <!-- Название ингредиента (только для чтения) -->
                    <div class="form-group">
                        <label>Имя ингредиента:</label>
                        <input type="text" class="form-control"
                               th:value="${ing.ingredient.name}" readonly/>
                    </div>

                    <!-- Описание ингредиента (только для чтения) -->
                    <div class="form-group">
                        <label>Описание ингредиента:</label>
                        <input type="text" class="form-control"
                               th:value="${ing.ingredient.description}" readonly/>
                    </div>

                    <!-- Количество (редактируемое) -->
                    <div class="form-group">
                        <label th:for="'ingredientCount' + ${ingStat.index}">Количество:</label>
                        <input type="text" th:id="'ingredientCount' + ${ingStat.index}" class="form-control"
                               th:field="*{ingredients[__${ingStat.index}__].count}"/>
                    </div>

                    <!-- Тип единицы (редактируемый) -->
                    <div class="form-group">
                        <label th:for="'ingredientUnitType' + ${ingStat.index}">Тип единицы:</label>
                        <input type="text" th:id="'ingredientUnitType' + ${ingStat.index}" class="form-control"
                               th:field="*{ingredients[__${ingStat.index}__].unitType}"/>
                    </div>
                </li>
            </ul>
        </div>

        <!-- Шаги приготовления (только для чтения) -->
        <div class="section">
            <h2>Шаги приготовления</h2>
            <div th:each="step, stepStat : *{steps}" class="step mb-4">
                <h3>Шаг <span th:text="${stepStat.index + 1}"></span></h3>
                <input type="hidden" th:field="*{steps[__${stepStat.index}__].id}"/>

                <!-- Задача шага (только для чтения) -->
                <div class="form-group">
                    <label>Задача:</label>
                    <input type="text" class="form-control"
                           th:value="${step.goal}" readonly/>
                </div>

                <!-- Описание шага (только для чтения) -->
                <div class="form-group">
                    <label>Описание:</label>
                    <textarea class="form-control" th:text="${step.description}" readonly></textarea>
                </div>

                <!-- Ингредиенты шага (только для чтения) -->
                <div class="form-group">
                    <label>Ингредиенты:</label>
                    <ul class="list-group">
                        <li th:each="ing, ingStat : ${step.usesIngredients}" class="list-group-item">
                            <div class="form-group">
                                <label>Имя ингредиента:</label>
                                <input type="text" class="form-control"
                                       th:value="${ing.ingredient.name}" readonly/>
                            </div>
                            <div class="form-group">
                                <label>Количество:</label>
                                <input type="text" class="form-control"
                                       th:value="${ing.count}" readonly/>
                            </div>
                            <div class="form-group">
                                <label>Тип единицы:</label>
                                <input type="text" class="form-control"
                                       th:value="${ing.unitType}" readonly/>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Сохранить</button>
    </form>
</div>

<!-- Подключение Bootstrap JS и зависимостей -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
