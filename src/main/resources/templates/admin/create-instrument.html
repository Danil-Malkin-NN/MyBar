<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Новый инструмент — My Bar</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="fragments/topbar.html"></div>
<main class="container">
    <section class="panel">
        <p class="eyebrow">Панель администратора</p>
        <h1>Добавить инструмент</h1>
        <form th:action="@{/page/AdminPanel/instrument/save}" th:object="${instrument}" method="post" class="form-grid">
            <div class="field">
                <label for="name">Название</label>
                <input type="text" id="name" th:field="*{name}" required>
            </div>
            <div class="field">
                <label for="description">Описание</label>
                <textarea id="description" th:field="*{description}"></textarea>
            </div>
            <button type="submit">Сохранить</button>
        </form>
    </section>
</main>
</body>
</html>
