<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Мой бар</title>
<!--    Порядок стилей важен-->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="fragments/topbar.html"></div>

<div class="container">
    <!-- Блок "Мои коктейли" -->
    <h2>Мои коктейли</h2>
    <div th:if="${cocktails != null and !cocktails.isEmpty()}" class="grid">
        <div th:each="cocktail : ${cocktails}" class="card">
            <h3 th:text="${cocktail.name}">Название</h3>
            <p th:text="${cocktail.description}">Описание</p>
            <p><strong>Крепость:</strong> <span th:text="${cocktail.strength}">0</span>%</p>
            <ul>
                <li th:each="ing : ${cocktail.ingredients}"
                    th:text="${ing.name}"
                    th:classappend="${ing.available} ? 'ingredient-available' : 'ingredient-unavailable'">
                </li>
            </ul>

        </div>
    </div>
    <div th:if="${cocktails == null or cocktails.isEmpty()}" class="empty-message">
        У вас пока нет коктейлей. Добавьте доступные вам ингредиенты, а мы покажем доступные коктейли!
    </div>

    <!-- Блок "Мои ингредиенты" -->
    <h2>Мои ингредиенты</h2>
    <div th:if="${ingredients != null and !ingredients.isEmpty()}" class="grid">
        <div th:each="ingredient : ${ingredients}" class="card">
            <h3 th:text="${ingredient.name}">Название</h3>
            <p th:text="${ingredient.description}">Описание</p>
        </div>
    </div>
    <div th:if="${ingredients == null or ingredients.isEmpty()}" class="empty-message">
        У вас нет ингредиентов. Добавьте имеющиеся ингредиенты.
    </div>
</div>
</body>
</html>
