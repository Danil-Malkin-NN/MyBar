<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ингредиенты — My Bar</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body data-base-url="" th:attr="data-base-url=@{/}">
<div th:replace="fragments/topbar.html"></div>
<main class="container">
    <header class="page-heading">
        <div class="collection-heading-copy">
            <p class="eyebrow">Домашний бар</p>
            <h1>Ингредиенты</h1>
            <p class="lede">Отмечайте то, что есть под рукой, чтобы найти подходящие рецепты.</p>
        </div>
        <div class="collection-heading-art ingredient-heading-art" aria-hidden="true">
            <img th:src="@{/images/ingredient-citrus.svg}" alt="">
            <img th:src="@{/images/ingredient-herbs.svg}" alt="">
            <img th:src="@{/images/ingredient-bottle.svg}" alt="">
        </div>
    </header>
    <form method="get" th:action="@{/page/ingredients}" class="filter-panel">
        <div class="filter-actions">
            <input type="search" name="ingredientName" aria-label="Поиск ингредиента" placeholder="Название ингредиента"
                   th:value="${param.ingredientName}">
            <button type="submit">Найти</button>
        </div>
    </form>
    <section class="grid">
        <article th:each="ingredient : ${ingredients}" class="card">
            <div class="card-content">
                <img class="card-image" alt="" th:if="${ingredient.image != null}"
                     th:src="@{/media/images/{filename}(filename=${ingredient.image})}">
                <img class="entity-art ingredient-art" data-icon-kind="ingredient"
                     th:attr="data-icon-name=${ingredient.name}" th:unless="${ingredient.image != null}" alt="">
                <h2 class="card-title" th:text="${ingredient.name}">Название</h2>
                <p class="muted" th:text="${ingredient.description}"></p>
                <div class="card-actions">
                    <div sec:authorize="isAuthenticated()">
                        <button th:attr="data-id=${ingredient.id}" th:if="${ingredient.available}"
                                class="favorite-remove-btn" aria-label="Убрать из бара">Есть</button>
                        <button th:attr="data-id=${ingredient.id}" th:unless="${ingredient.available}"
                                class="favorite-add-btn" aria-label="Добавить в бар">Добавить</button>
                    </div>
                    <a sec:authorize="hasRole('ADMIN')"
                       th:href="@{/page/AdminPanel/ingredients/{id}(id=${ingredient.id})}">Изменить</a>
                </div>
            </div>
        </article>
    </section>
    <nav class="pagination">
        <a th:if="${page.hasPrevious()}" th:href="@{/page/ingredients(page=${page.number - 1},size=${page.size})}">← Раньше</a>
        <span th:text="|Страница ${page.number + 1} из ${page.totalPages}|"></span>
        <a th:if="${page.hasNext()}" th:href="@{/page/ingredients(page=${page.number + 1},size=${page.size})}">Дальше →</a>
    </nav>
</main>
<script th:src="@{/js/favorite_ingredient.js}"></script>
<script th:src="@{/js/entity-icons.js}" defer></script>
</body>
</html>
