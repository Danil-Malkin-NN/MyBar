<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Моё приложение</title>

    <!-- Библиотека стилей (например, Tailwind CSS) -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

    <!-- Ваши собственные стили -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body data-base-url="" th:attrappend="data-base-url=@{/}">

<div th:replace="fragments/topbar.html"></div>


<div class="container">
    <form method="get" th:action="@{/page/ingredients}" class="mb-6 flex items-center gap-4">
        <input type="text" name="ingredientName" placeholder="Поиск по имени"
               class="px-4 py-2 rounded-2xl shadow-sm border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
               th:value="${param.ingredientName}">
        <button type="submit"
                class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-2xl shadow-md transition-all duration-200">
            Найти
        </button>
    </form>


    <div class="grid">
        <div th:each="ingredient : ${ingredients}" class="border rounded-lg p-4 shadow-sm mb-4">
        <h3 th:text="${ingredient.name}" class="font-bold text-lg"></h3>
            <p th:text="${ingredient.description}"></p>

            <button th:attr="data-id=${ingredient.id}"
                    th:if="${ingredient.available}"
                    class="favorite-remove-btn">❤️</button>

            <button th:attr="data-id=${ingredient.id}"
                    th:if="${!ingredient.available}"
                    class="favorite-add-btn">🤍</button>
        </div>

    </div>

    <div class="pagination">
        <a th:href="@{/page/ingredients(page=${page.number - 1}, size=${page.size})}"
           th:if="${page.hasPrevious()}" class="btn">Назад</a>

        <span>Страница <span th:text="${page.number + 1}">1</span> из <span th:text="${page.totalPages}">1</span></span>

        <a th:href="@{/page/ingredients(page=${page.number + 1}, size=${page.size})}"
           th:if="${page.hasNext()}" class="btn">Вперёд</a>
    </div>
</div>
<script>
    window.appContextPath = /*[[@{/}]]*/ '';
</script>
<script th:src="@{/js/favorite.js}"></script>
