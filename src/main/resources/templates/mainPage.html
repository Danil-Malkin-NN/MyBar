<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Моё приложение</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- Топбар -->
<div class="topbar">
    <a th:href="@{/page}">Главная</a>
    <a th:href="@{/page/ingredients}">Ингредиенты</a>
    <a th:href="@{/page/tools}">Инструменты</a>
    <a th:href="@{/page/mybar}">Мой Бар</a>
</div>

<!-- Основной контент -->
<div class="container">

    <!-- Сетка карточек -->
    <div class="grid">
        <div class="card" th:each="cocktail : ${items}">
            <h3>
                <a th:href="@{/page/cocktails/{id}(id=${cocktail.id})}"
                   th:text="${cocktail.name}"
                   style="text-decoration: none; color: inherit;"></a>
            </h3>
            <p th:text="${cocktail.description}">Описание напитка...</p>
            <p><strong>Крепость:</strong> <span th:text="${cocktail.strength}">15%</span></p>
            <p class="ingredients">
                <strong>Ингредиенты:</strong>
                <span th:text="${cocktail.ingredients}">Водка, Лимон, Сахар</span>
            </p>
        </div>
    </div>

    <div class="pagination">
        <a th:href="@{/(page=${page.number - 1}, size=${page.size})}"
           th:if="${page.hasPrevious()}" class="btn">Назад</a>

        <span>Страница <span th:text="${page.number + 1}">1</span> из <span th:text="${page.totalPages}">1</span></span>

        <a th:href="@{/(page=${page.number + 1}, size=${page.size})}"
           th:if="${page.hasNext()}" class="btn">Вперёд</a>
    </div>

</div>

</body>
</html>
