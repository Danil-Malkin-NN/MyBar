<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Моё приложение</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body data-base-url="" th:attrappend="data-base-url=@{/}">

<!-- Топбар -->
<div th:replace="fragments/topbar.html"></div>

<!-- Основной контент -->
<div class="container">

    <form method="get" th:action="@{/page}" class="mb-6 flex items-center gap-4">
        <input type="text" name="cocktailName" placeholder="Поиск по имени"
               class="px-4 py-2 rounded-2xl shadow-sm border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
               th:value="${param.cocktailName}">
        <button type="submit"
                class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-2xl shadow-md transition-all duration-200">
            Найти
        </button>
    </form>

    <!-- Сетка карточек -->
    <div class="grid">

        <div th:each="cocktail : ${items}" class="border rounded-lg p-4 shadow-sm mb-4">

            <div class="card-body">
                <div class="card-image">
                    <img th:if="${cocktail.image!=null}"
                         th:src="@{/media/images/{filename}(filename=${cocktail.image})}" alt="Cocktail Image"/>
                </div>

                <div class="card-content">
                    <h2 th:href="@{/page/cocktails/{id}(id=${cocktail.id})}"
                        th:text="${cocktail.name}"></h2>
                    <div class="tags">
                        <span class="tag">Терпкий</span>
                        <span class="tag">Кислый</span>
                    </div>
                    <div class="rating">
                        <span class="number">20</span>
                        <div class="flex items-center gap-2 mt-2">
                            <button th:attr="data-id=${cocktail.id}"
                                    th:if="${cocktail.favorite}"
                                    class="favorite-remove-btn">❤️
                            </button>

                            <button th:attr="data-id=${cocktail.id}"
                                    th:if="${!cocktail.favorite}"
                                    class="favorite-add-btn">🤍
                            </button>

                            <!-- Кнопка EDIT только для админа -->
                            <iframe sec:authorize="isAuthenticated()">
                                <div sec:authorize="hasRole('ROLE_ADMIN')">
                                    <a th:href="@{/page/AdminPanel/cocktaill/{id}(id=${cocktail.id})}"
                                       class="custom-button">
                                        EDIT
                                    </a>
                                </div>
                            </iframe>
                        </div>
                    </div>
                </div>
            </div>


        </div>

        <div class="pagination">
            <a th:href="@{/page(page=${page.number - 1}, size=${page.size}, cocktailName=${param.cocktailName})}"
               th:if="${page.hasPrevious()}" class="btn">Назад</a>

            <span>Страница <span th:text="${page.number + 1}">1</span> из <span
                    th:text="${page.totalPages}">1</span></span>

            <a th:href="@{/page(page=${page.number + 1}, size=${page.size}, cocktailName=${param.cocktailName})}"
               th:if="${page.hasNext()}" class="btn">Вперёд</a>
        </div>
    </div>

    <script th:src="@{/js/favorite_cocktail.js}"></script>
</body>
</html>
