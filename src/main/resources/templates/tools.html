<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Моё приложение</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body data-base-url="" th:attrappend="data-base-url=@{/}">

<!-- Топбар -->
<div th:replace="fragments/topbar.html"></div>

<div class="container">
    <div class="grid">
        <div th:each="tool : ${tools}" class="border rounded-lg p-4 shadow-sm mb-4">
            <img alt="Image" th:if="${tool.image!=null}" th:src="@{/media/images/{filename}(filename=${tool.image})}"/>
            <h3>
                <a th:text="${tool.name}"
                   class="text-xl font-semibold text-black">
                </a>
            </h3>
            <p th:text="${tool.description}">Описание...</p>
            <iframe sec:authorize="isAuthenticated()">
                <div sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/page/AdminPanel/instrument/{id}(id=${tool.id})}"
                       class="custom-button">
                        EDIT
                    </a>
                </div>
            </iframe>

        </div>
    </div>

    <div class="pagination">
        <a th:href="@{/page/tools(page=${page.number - 1}, size=${page.size})}"
           th:if="${page.hasPrevious()}">Назад</a>

        <span>Страница <span th:text="${page.number + 1}">1</span> из <span th:text="${page.totalPages}">1</span></span>

        <a th:href="@{/page/tools(page=${page.number + 1}, size=${page.size})}"
           th:if="${page.hasNext()}">Вперёд</a>
    </div>
</div>

</body>
</html>
