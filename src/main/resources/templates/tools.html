<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Инструменты — My Bar</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="fragments/topbar.html"></div>
<main class="container">
    <header class="page-heading">
        <div class="collection-heading-copy">
            <p class="eyebrow">Домашний бар</p>
            <h1>Инструменты</h1>
            <p class="lede">Базовые инструменты, которые помогают готовить аккуратно и быстро.</p>
        </div>
        <div class="collection-heading-art tool-heading-art" aria-hidden="true">
            <img th:src="@{/images/tool-shaker.svg}" alt="">
            <img th:src="@{/images/tool-jigger.svg}" alt="">
            <img th:src="@{/images/tool-spoon.svg}" alt="">
        </div>
    </header>
    <section class="grid">
        <article th:each="tool : ${tools}" class="card">
            <div class="card-content">
                <img class="card-image" alt="" th:if="${tool.image != null}"
                     th:src="@{/media/images/{filename}(filename=${tool.image})}">
                <img class="entity-art tool-art" data-icon-kind="tool" th:attr="data-icon-name=${tool.name}"
                     th:unless="${tool.image != null}" alt="">
                <h2 class="card-title" th:text="${tool.name}">Инструмент</h2>
                <p class="muted" th:text="${tool.description}">Описание</p>
                <a sec:authorize="hasRole('ADMIN')"
                   th:href="@{/page/AdminPanel/instrument/{id}(id=${tool.id})}">Изменить</a>
            </div>
        </article>
    </section>
    <nav class="pagination">
        <a th:if="${page.hasPrevious()}" th:href="@{/page/tools(page=${page.number - 1},size=${page.size})}">← Раньше</a>
        <span th:text="|Страница ${page.number + 1} из ${page.totalPages}|"></span>
        <a th:if="${page.hasNext()}" th:href="@{/page/tools(page=${page.number + 1},size=${page.size})}">Дальше →</a>
    </nav>
</main>
<script th:src="@{/js/entity-icons.js}" defer></script>
</body>
</html>
