version: "3.9"
services:
  postgres_bd:
    image: postgres:14.7-alpine
    user: root
    volumes:
      - ./db-data:/var/postgres/data
      - ./docker_config/postgres:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    ports:
      - "5432:5432"

  keycloak_web:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: keycloak_web
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres_bd:5432/postgres?currentSchema=keycloak
      KC_DB_USERNAME: "postgres"
      KC_DB_PASSWORD: "postgres"
#
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8081

      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev --import-realm
    volumes:
      - ./docker_config/KeyCloak/:/opt/keycloak/data/import
    depends_on:
      - postgres_bd
    ports:
      - "8081:8080"


  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"   # API (S3 совместимый)
      - "9001:9001"   # Web-интерфейс
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  minio_data:
