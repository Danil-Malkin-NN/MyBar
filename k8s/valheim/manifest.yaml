apiVersion: apps/v1
kind: Deployment
metadata:
  name: valheim-server
  namespace: valheim
  labels:
    app: valheim
  annotations:
    deployment.kubernetes.io/revision: '1'
    kubectl.kubernetes.io/last-applied-configuration: >
      {"apiVersion":"apps/v1","kind":"Deployment","metadata":{"annotations":{},"labels":{"app":"valheim"},"name":"valheim-server","namespace":"valheim"},"spec":{"replicas":1,"selector":{"matchLabels":{"app":"valheim"}},"template":{"metadata":{"labels":{"app":"valheim"}},"spec":{"containers":[{"env":[{"name":"SERVER_NAME","valueFrom":{"configMapKeyRef":{"key":"SERVER_NAME","name":"valheim-config"}}},{"name":"WORLD_NAME","valueFrom":{"configMapKeyRef":{"key":"WORLD_NAME","name":"valheim-config"}}},{"name":"SERVER_PASS","valueFrom":{"secretKeyRef":{"key":"SERVER_PASS","name":"valheim-secret"}}}],"image":"ghcr.io/lloesche/valheim-server","lifecycle":{"preStop":{"exec":{"command":["sleep","120"]}}},"name":"valheim","ports":[{"containerPort":2456,"hostPort":2456,"protocol":"UDP"},{"containerPort":2457,"hostPort":2457,"protocol":"UDP"}],"volumeMounts":[{"mountPath":"/config","name":"config"},{"mountPath":"/opt/valheim","name":"data"}]}],"volumes":[{"name":"config","persistentVolumeClaim":{"claimName":"valheim-config-pvc"}},{"name":"data","persistentVolumeClaim":{"claimName":"valheim-data-pvc"}}]}}}}
  selfLink: /apis/apps/v1/namespaces/valheim/deployments/valheim-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valheim
  template:
    metadata:
      labels:
        app: valheim
    spec:
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: valheim-config-pvc
        - name: data
          persistentVolumeClaim:
            claimName: valheim-data-pvc
      containers:
        - name: valheim
          image: ghcr.io/lloesche/valheim-server
          ports:
            - hostPort: 2456
              containerPort: 2456
              protocol: UDP
            - hostPort: 2457
              containerPort: 2457
              protocol: UDP
          env:
            - name: SERVER_NAME
              valueFrom:
                configMapKeyRef:
                  name: valheim-config
                  key: SERVER_NAME
            - name: WORLD_NAME
              valueFrom:
                configMapKeyRef:
                  name: valheim-config
                  key: WORLD_NAME
            - name: SERVER_PASS
              valueFrom:
                secretKeyRef:
                  name: valheim-secret
                  key: SERVER_PASS
          resources: { }
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /opt/valheim
          lifecycle:
            preStop:
              exec:
                command:
                  - sleep
                  - '120'
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: { }
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
