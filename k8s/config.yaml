apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-bar-project
  namespace: my-bar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-bar-project
  template:
    metadata:
      labels:
        app: my-bar-project
    spec:
      containers:
        - name: my-bar-project
          image: dockerhub.timeweb.cloud/${IMAGE_NAME}
          ports:
            - containerPort: 8080
            - containerPort: 5005
          env:
            - name: DATABASE_HOST
              value: postgres-service
            - name: DATABASE_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_USER
              value: postgres
            - name: KEY_CLOAK_URL
              value: keycloak-serv
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password

            - name: MINIO_URL
              value: http://minio-service:9000
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: user

            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: password

            - name: LOG_LEVEL
              value: DEBUG
---
apiVersion: v1
kind: Service
metadata:
  name: my-bar-service
  namespace: my-bar
spec:
  selector:
    app: my-bar-project
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: debug-service
  namespace: my-bar
spec:
  selector:
    app: my-bar-project
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5005
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  namespace: my-bar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: dockerhub.timeweb.cloud/postgres:16.2
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password


          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-storage

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-bar
---

apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: my-bar
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP

---

apiVersion: v1
kind: Secret
metadata:
  namespace: my-bar
  name: postgres-secret
type: Opaque
data:
  password: cG9zdGdyZXM=
# Используйте команду `echo -n 'yourpassword' | base64` для создания этого значения
#  password: postgres
